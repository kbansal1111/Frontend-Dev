<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-sm-9 col-md-6 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title mb-3 text-center">Sign in</h3>
                        <p class="text-center text-muted small">Please enter your credentials to sign in.</p>

                        <form method="post" action="#" role="form" aria-label="Sign in form" autocomplete="on">
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required autocomplete="email" autofocus>
                                <label for="email">Email address</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required autocomplete="current-password">
                                <label for="password">Password</label>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label" for="remember">Remember me</label>
                            </div>

                            <div class="d-grid mb-2">
                                <button type="submit" class="btn btn-primary">Sign In</button>
                            </div>

                            <div class="text-center">
                                <a href="#" class="link-secondary small">Forgot password?</a>
                            </div>
                        </form>
                    </div>
                </div>
                <p class="text-center text-muted small mt-3">Don't have an account? <a href="#">Sign up</a></p>
            </div>
        </div>
    </div>

</body>
</html>
