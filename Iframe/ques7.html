<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
</head>
<body>
    <form>
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username"><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"><br><br>

        <!-- 
            A CSRF (Cross-Site Request Forgery) token is a unique, secret, unpredictable value 
            generated by the server-side application and transmitted to the client. 
            The client includes the token with each subsequent request. The server validates 
            the token to ensure the request is legitimate and not from a malicious third party.
        -->
        <input type="hidden" name="csrf_token" value="dummy-csrf-token-12345">

        <input type="submit" value="Login">
    </form>
</body>
</html>
