<!DOCTYPE html>
<html>
<head>
    <title>File Upload</title>
</head>
<body>
    <form>
        <label for="file_upload">Upload your image:</label><br>
        <input type="file" id="file_upload" name="file_upload" accept=".jpg, .png"><br><br>
        <p>Please upload only .jpg or .png files.</p>
        <input type="submit" value="Upload">
    </form>
</body>
</html>
