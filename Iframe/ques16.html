<!DOCTYPE html>
<html>
<head>
    <title>URI Encoding</title>
</head>
<body>
    <p>An incorrectly encoded URL (will likely fail):</p>
    <a href="https://example.com/search?query=HTML & CSS">https://example.com/search?query=HTML & CSS</a>

    <p>A correctly encoded URL:</p>
    <a href="https://example.com/search?query=HTML%20&%20CSS">https://example.com/search?query=HTML%20&%20CSS</a>
</body>
</html>
