<!DOCTYPE html>
<html>
<head>
    <title>Quotations</title>
</head>
<body>
    <blockquote>
        This is a long quotation, often used for multi-line quotes. It is typically rendered as an indented block. It can contain many words &amp; special characters.
    </blockquote>

    <p>
        In this paragraph, we include a short quote using the <q>q</q> tag, which is meant for inline quotations.
    </p>
</body>
</html>
