<!DOCTYPE html>
<html>
<head>
    <title>HTML Entities</title>
</head>
<body>
    <p>
        The less-than sign is &lt;, the greater-than sign is &gt;, the ampersand is &amp;, the double quote is &quot;, and the single quote is &apos;.
    </p>
    <p>
        Common symbols: Copyright is &copy;, Trademark is &trade;, and Registered Trademark is &reg;.
    </p>
</body>
</html>
